name: Erreur médicale
description: Un texte, un chiffre ou une animation qui semble faux sur le plan médical.
title: "[Médical] "
labels: ["contenu médical"]
body:
  - type: markdown
    attributes:
      value: "Merci ! Ne publiez jamais de données de patient identifiables."
  - type: input
    id: ou
    attributes:
      label: Où ?
      description: Vue, maladie, traitement ou présentation concernée.
      placeholder: "Ex. : Maladies › Insuffisance cardiaque › fiche, niveau Approfondir"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui est affiché
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Ce qui devrait être affiché
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Recommandation (ESC, ESH…), essai, RCP, manuel. Indispensable pour corriger.
    validations:
      required: true
